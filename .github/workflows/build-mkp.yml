name: Build MKP Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Checkmk Docker image
        run: |
          docker pull checkmk/check-mk-raw:2.4.0-latest

      - name: Start Checkmk
        run: |
          docker run -d \
            --name checkmk \
            -p 5000:5000 \
            checkmk/check-mk-raw:2.4.0-latest
      
          echo "Waiting for container..."
          sleep 30
      
          docker exec checkmk omd status cmk

      - name: Copy repository into container
        run: |
          docker cp . checkmk:/tmp/checkmk-smseagle

      - name: Build manifest
        run: |
          docker exec checkmk bash -c "
            cd /tmp/checkmk-smseagle
            bash scripts/build-manifest.sh
          "

      - name: Install plugin files
        run: |
          docker exec checkmk bash -c "
            cp -a /tmp/checkmk-smseagle/agent_based \
              /omd/sites/cmk/local/lib/python3/cmk_addons/plugins/smseagle/

            cp -a /tmp/checkmk-smseagle/graphing \
              /omd/sites/cmk/local/lib/python3/cmk_addons/plugins/smseagle/

            cp -a /tmp/checkmk-smseagle/rulesets \
              /omd/sites/cmk/local/lib/python3/cmk_addons/plugins/smseagle/

            mkdir -p /omd/sites/cmk/local/share/check_mk/checkman

            cp -a /tmp/checkmk-smseagle/checkman/. \
              /omd/sites/cmk/local/share/check_mk/checkman/

            cp /tmp/checkmk-smseagle/build/smseagle.manifest \
              /omd/sites/cmk/tmp/

            chown -R cmk:cmk /omd/sites/cmk/local
          "

      - name: Build MKP
        run: |
          docker exec checkmk bash -c "
            su - cmk -c 'mkp package /omd/sites/cmk/tmp/smseagle.manifest'
          "

      - name: Copy MKP
        run: |
          mkdir artifacts

          docker cp \
            checkmk:/omd/sites/cmk/var/check_mk/packages_local/. \
            artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smseagle-mkp
          path: artifacts/*.mkp

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.mkp
