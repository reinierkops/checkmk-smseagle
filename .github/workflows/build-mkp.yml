name: Build MKP Package

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      #########################################################################
      # Checkout
      #########################################################################

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      #########################################################################
      # Build manifest (locally)
      #########################################################################

      - name: Build manifest
        run: |
          bash scripts/build-manifest.sh

      #########################################################################
      # Start Checkmk
      #########################################################################

      - name: Start Checkmk
        run: |
          docker pull checkmk/check-mk-raw:2.4.0-latest
      
          docker run -d \
            --name checkmk \
            -p 5000:5000 \
            checkmk/check-mk-raw:2.4.0-latest
      
          echo "Waiting for container initialization..."
      
          timeout=180
          elapsed=0
      
          until docker logs checkmk 2>&1 | grep -q "### CONTAINER STARTED"; do
      
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "Timeout waiting for container"
      
              echo
              docker logs checkmk
      
              exit 1
            fi
      
            sleep 5
            elapsed=$((elapsed+5))
      
            echo "Waiting... ${elapsed}s"
      
          done
      
          echo "Container ready."
      
          docker exec checkmk omd status cmk

      #########################################################################
      # Copy repository
      #########################################################################

      - name: Copy repository into container
        run: |
          docker cp . checkmk:/tmp/checkmk-smseagle

      #########################################################################
      # Synchronize plugin
      #########################################################################

      - name: Synchronize plugin
        run: |
          SITE=cmk CONTAINER=checkmk \
            bash scripts/sync-plugin.sh

      #########################################################################
      # Copy manifest
      #########################################################################

      - name: Copy manifest
        run: |
          docker cp \
            build/smseagle.manifest \
            checkmk:/omd/sites/cmk/tmp/

      #########################################################################
      # Debug
      #########################################################################

      - name: Debug plugin layout
        run: |

          docker exec checkmk bash -c "

            echo '===== Plugin ====='

            find /omd/sites/cmk/local/lib/python3/cmk_addons/plugins \
              -type f | sort

            echo

            echo '===== Checkman ====='

            find /omd/sites/cmk/local/share/check_mk/checkman \
              -type f | sort

            echo

            echo '===== Manifest ====='

            cat /omd/sites/cmk/tmp/smseagle.manifest

          "

      #########################################################################
      # Build MKP
      #########################################################################

      - name: Build MKP
        run: |

          docker exec checkmk bash -c "

            su - cmk -c '
              mkp package /omd/sites/cmk/tmp/smseagle.manifest
            '

          "

      #########################################################################
      # Collect artifact
      #########################################################################

      - name: Collect MKP
        run: |

          mkdir artifacts

          docker cp \
            checkmk:/omd/sites/cmk/var/check_mk/packages_local/. \
            artifacts/

          ls -lh artifacts

      #########################################################################
      # Upload artifact
      #########################################################################

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smseagle-mkp
          path: artifacts/*.mkp

      #########################################################################
      # Publish Release
      #########################################################################

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.mkp

      #########################################################################
      # Cleanup
      #########################################################################

      - name: Cleanup
        if: always()
        run: |
          docker rm -f checkmk || true
